name: Public repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source and public boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "1"
      GOMAXPROCS: "2"
      RAYON_NUM_THREADS: "2"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Create safe local fixture configuration
        run: npm run setup:local
      - name: Check committed public material
        run: npm run check:public
      - name: Types, portal build and component suites
        run: npm run check:room-runtime
